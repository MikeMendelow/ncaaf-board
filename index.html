<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCAAF Line Board</title>
<style>
:root{--paper:#EDEFEA;--surface:#FFFFFF;--ink:#111A16;--ink-2:#3B4A43;--muted:#66766E;
 --line:#D3DAD3;--brass:#8F6B18;--hot:#AE3A1E;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#0D1411;--surface:#151E1A;--ink:#E7EDE9;--ink-2:#B6C4BC;--muted:#7F9188;
 --line:#26332D;--brass:#D9AD4E;--hot:#E8815F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--line);padding:30px 32px;max-width:390px;width:100%}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;font-size:40px;line-height:.95;
 text-transform:uppercase;margin:6px 0 14px;letter-spacing:-.01em}
h1 span{color:var(--brass)}
p{margin:0 0 18px;font-size:13.5px;color:var(--ink-2)}
label{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);
 background:var(--paper);color:var(--ink);border-radius:2px}
input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button{margin-top:14px;width:100%;font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;
 font-size:17px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:9px;
 border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;border-radius:2px}
button:disabled{opacity:.55;cursor:default}
.err{margin-top:12px;font-size:13px;color:var(--hot);min-height:19px}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
</style></head>
<body>
<div id="gate"><form class="card" id="f">
  <div class="eyebrow">Private</div>
  <h1>NCAAF<br>Line <span>Board</span></h1>
  <p>This page is encrypted. Enter the password to read it.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button id="go" type="submit">Unlock</button>
  <div class="err" id="err" role="status" aria-live="polite"></div>
  <div class="foot">Analysis, not advice. Bet what you can afford to lose.</div>
</form></div>

<script>
(function(){
  var D=JSON.parse(document.getElementById("blob").textContent);
  var b64=function(s){var r=atob(s),a=new Uint8Array(r.length);
    for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;};
  var err=document.getElementById("err"),go=document.getElementById("go");

  function paint(html){
    document.open();document.write(html);document.close();
  }
  async function unlock(pw,quiet){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:b64(D.salt),iterations:D.iter,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},key,b64(D.ct));
    var html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem("nlb_pw",pw);}catch(e){}
    paint("<!doctype html><html><head><meta charset=utf-8>"+
      "<meta name=viewport content=\"width=device-width,initial-scale=1\"></head><body>"+
      html+"</body></html>");
  }
  document.getElementById("f").addEventListener("submit",async function(e){
    e.preventDefault();err.textContent="";go.disabled=true;go.textContent="Decrypting\u2026";
    try{await unlock(document.getElementById("pw").value,false);}
    catch(ex){err.textContent="Wrong password.";go.disabled=false;go.textContent="Unlock";
      document.getElementById("pw").select();}
  });
  try{
    var saved=sessionStorage.getItem("nlb_pw");
    if(saved){unlock(saved,true).catch(function(){try{sessionStorage.removeItem("nlb_pw");}catch(e){}});}
  }catch(e){}
})();
</script>
