<style>
:root{--paper:#EDEFEA;--surface:#FFFFFF;--ink:#111A16;--ink-2:#3B4A43;--muted:#66766E;--line:#D3DAD3;--brass:#8F6B18;--hot:#AE3A1E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0D1411;--surface:#151E1A;--ink:#E7EDE9;--ink-2:#B6C4BC;--muted:#7F9188;--line:#26332D;--brass:#D9AD4E;--hot:#E8815F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);padding:26px 24px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
h1{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:34px;line-height:.96;text-transform:uppercase;margin:0 0 14px;letter-spacing:-.01em}
h1 span{color:var(--brass)}
label{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:2px}
input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button{margin-top:12px;width:100%;font-family:"Barlow Condensed",system-ui,sans-serif;font-size:16px;font-weight:600;
letter-spacing:.09em;text-transform:uppercase;padding:9px 12px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;border-radius:2px}
button[disabled]{opacity:.55;cursor:progress}
.msg{margin-top:11px;font-size:13px;color:var(--hot);min-height:1.2em}
.foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
</style></head><body>

<script>
const B=JSON.parse(document.getElementById("blob").textContent);
const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d64(B.salt),iterations:B.iter,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(B.iv)},k,d64(B.ct));
  return new TextDecoder().decode(pt);
}
function show(html){
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),m=document.getElementById("m"),b=document.getElementById("b");
f.addEventListener("submit",async e=>{
  e.preventDefault();m.textContent="";b.disabled=true;b.textContent="Deriving\u2026";
  try{
    const html=await unlock(document.getElementById("p").value);
    try{sessionStorage.setItem("nb_pw",document.getElementById("p").value);}catch(_){}
    show(html);
  }catch(err){
    m.textContent="Wrong password.";b.disabled=false;b.textContent="Unlock";
    document.getElementById("p").select();
  }
});
(async()=>{let s=null;try{s=sessionStorage.getItem("nb_pw");}catch(_){}
  if(!s)return; try{show(await unlock(s));}catch(_){try{sessionStorage.removeItem("nb_pw");}catch(__){}}})();
</script>
</body></html>
