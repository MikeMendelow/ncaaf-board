<style>
:root{--paper:#EDEFEA;--surface:#FFF;--ink:#111A16;--ink-2:#3B4A43;--muted:#66766E;

@media (prefers-color-scheme:dark){:root{--paper:#0D1411;--surface:#151E1A;--ink:#E7EDE9;

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--line);padding:30px 28px;max-width:380px;width:100%}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
h1{margin:0 0 4px;font-size:30px;line-height:1;letter-spacing:-.01em;text-transform:uppercase}
h1 span{color:var(--brass)}
p.sub{margin:10px 0 20px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
label{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);
 background:var(--paper);color:var(--ink);border-radius:2px}
input:focus{outline:2px solid var(--brass);outline-offset:1px}
button{margin-top:12px;width:100%;font:inherit;font-size:14px;font-weight:600;letter-spacing:.06em;
 text-transform:uppercase;padding:10px;border:1px solid var(--ink);background:var(--ink);
 color:var(--paper);cursor:pointer;border-radius:2px}
button[disabled]{opacity:.55;cursor:default}
.err{margin-top:12px;font-size:13px;color:var(--hot);min-height:18px}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
</style></head><body>

<script>
(function(){
  var B=JSON.parse(document.getElementById('blob').textContent);
  function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  async function unlock(pw){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(B.salt),iterations:B.iter,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.iv)},k,b64(B.ct));
    return new TextDecoder().decode(pt);
  }
  function show(html){
    document.open();document.write(html);document.close();
  }
  var f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
  async function attempt(pw,quiet){
    go.disabled=true;err.textContent=quiet?'':'Decrypting\u2026';
    try{ var html=await unlock(pw); try{sessionStorage.setItem('ncaaf_pw',pw);}catch(e){} show(html); }
    catch(e){ go.disabled=false; err.textContent=quiet?'':'Wrong password.';
      if(quiet){try{sessionStorage.removeItem('ncaaf_pw');}catch(e2){}} }
  }
  f.addEventListener('submit',function(ev){ev.preventDefault();attempt(document.getElementById('pw').value,false);});
  var cached=null; try{cached=sessionStorage.getItem('ncaaf_pw');}catch(e){}
  if(cached) attempt(cached,true);
})();
</script>
